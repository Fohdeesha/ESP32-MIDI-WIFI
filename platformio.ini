[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
; Pinned so CI release builds use the same toolchain that was tested locally.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
; Board is an N16R8: 16MB quad flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
build_flags =
    -DFW_VERSION='"1.7.2"'
    ; Compile AppleMIDI's session-initiator support (sendInvite)
    -DAPPLEMIDI_INITIATOR
    ; Exception callback (session-drop reasons on the web status page)
    -DUSE_EXT_CALLBACKS
    -DBOARD_HAS_PSRAM
    ; Console on UART0 / USB-Serial-JTAG, keep the OTG port free for host mode
    -DARDUINO_USB_MODE=1
; Fixes AppleMIDI 3.3.0 bugs at build time (per-byte SysEx Serial tracing,
; the session timeout the initiator flag compiles out, lost-OK lockout, journal
; and datagram parsing, sequence wrap) -- see the script's header. Fails the
; build if the upstream text changes, and src/rtp_midi.cpp refuses to compile
; against a copy the script has not patched.
extra_scripts = pre:tools/patch_applemidi.py
lib_deps =
    ; Pinned exactly: the only published release, and tools/patch_applemidi.py
    ; asserts against its contents.
    lathoub/AppleMIDI@3.3.0
    ; Pinned exactly too: src/midi_bridge.cpp relies on how this version hands
    ; over SysEx longer than its 128-byte buffer (F0..F0 / F7..F0 / F7..F7).
    fortyseveneffects/MIDI Library@5.0.2
